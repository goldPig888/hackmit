# HALO BoT-SORT + ReID — appearance-based identity persistence.
# ReID embeddings let a person keep their ID after leaving/re-entering frame.
# GMC compensates camera motion inside the tracker (complements our IMU path).

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.45
track_buffer: 90
match_thresh: 0.5
fuse_score: True

gmc_method: none   # IMU already compensates ego-motion; skip per-frame optflow

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
